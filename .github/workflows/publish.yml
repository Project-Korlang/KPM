name: Publish Registry

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**.json'
      - 'authors/**.json'
      - 'manage.py'
      - 'index.html'
      - 'css/**'
      - 'js/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate Index
        run: python manage.py index

      - name: Commit Index Update
        run: |
          git config --global user.name "KPM Bot"
          git config --global user.email "bot@korlang.org"
          if [[ `git status --porcelain index.json` ]]; then
            git add index.json
            git commit -m "Auto-update index.json [skip ci]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

      - name: Notify Discord
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
             curl -H "Content-Type: application/json" \
             -d '{"content": "🚀 Registry updated! New packages available."}' \
             $DISCORD_WEBHOOK
          fi
