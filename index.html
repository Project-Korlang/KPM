<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>KPM | Korlang Package Registry</title>
    <link href='https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600;800&display=swap' rel='stylesheet'>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
            line-height: 1.5;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }
        .logo {
            font-weight: 800;
            font-size: 1.8rem;
            letter-spacing: -1px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .search-container {
            position: relative;
            margin-bottom: 3rem;
        }
        #search {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.2rem 1.5rem;
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        #search:focus { border-color: var(--accent); }
        .stats-bar {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
            font-size: 0.9rem;
            color: var(--text-dim);
        }
        .pkg-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .pkg-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: transform 0.2s, border-color 0.2s;
        }
        .pkg-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }
        .pkg-name {
            font-weight: 600;
            font-size: 1.2rem;
            color: var(--accent);
            text-decoration: none;
            display: block;
            margin-bottom: 0.5rem;
        }
        .pkg-desc {
            color: var(--text-dim);
            font-size: 0.95rem;
            height: 3rem;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            margin-bottom: 1.5rem;
        }
        .pkg-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
            padding-top: 1rem;
        }
        .install-cmd {
            font-family: 'Fira Code', monospace;
            background: #000;
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            color: #10b981;
        }
        .empty-state {
            text-align: center;
            grid-column: 1 / -1;
            padding: 5rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>
    <header>
        <div class='logo'>KPM REGISTRY</div>
        <nav>
            <a href='https://github.com/Project-Korlang/KPM' style='color: var(--text-dim); text-decoration: none;'>Docs</a>
        </nav>
    </header>

    <div class='search-container'>
        <input type='text' id='search' placeholder='Search 5000+ native packages...'>
    </div>

    <div class='stats-bar' id='stats'>
        Loading registry...
    </div>

    <div class='pkg-grid' id='pkg-grid'>
        <!-- Cards injected here -->
    </div>

    <script>
        async function fetchRegistry() {
            const grid = document.getElementById('pkg-grid');
            const stats = document.getElementById('stats');
            try {
                const res = await fetch('index.json');
                const data = await res.json();
                const pkgs = Object.entries(data.packages);
                
                stats.innerHTML = `<span>${pkgs.length} Packages</span> • <span>v1.0.0</span> • <span>Stable</span>`;

                if (pkgs.length === 0) {
                    grid.innerHTML = `<div class='empty-state'>
                        <h3>The Registry is Ready</h3>
                        <p>No packages found yet. Start the ecosystem by publishing the first library.</p>
                        <code style='color: var(--accent)'>kpm publish</code>
                    </div>`;
                    return;
                }

                grid.innerHTML = pkgs.map(([name, info]) => `
                    <div class='pkg-card'>
                        <a href='#' class='pkg-name'>${name}</a>
                        <p class='pkg-desc'>${info.description || 'Native Korlang library for building high-performance systems.'}</p>
                        <div class='pkg-footer'>
                            <span class='install-cmd'>kpm add ${name}</span>
                            <span style='color: var(--text-dim)'>v${info.version || '0.1.0'}</span>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                stats.textContent = 'Error: Could not sync with registry.';
            }
        }
        fetchRegistry();
    </script>
</body>
</html>
